name: Bug report
description: Report a reproducible problem in the offline workflow or a provider adapter.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove credentials, private media, and account identifiers before posting."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.6.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and manifest shape
      description: Include the command and a minimal redacted manifest excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
