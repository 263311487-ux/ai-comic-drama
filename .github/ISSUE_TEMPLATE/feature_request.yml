name: Feature request
description: Propose a focused improvement to the comic-drama workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What production bottleneck or repeated task should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Provider, cost, or safety constraints
