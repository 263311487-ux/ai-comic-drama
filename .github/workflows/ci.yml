name: CI
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/validate_manifest.py examples/episode.json
      - run: python scripts/validate_manifest.py examples/episode.json --strict
      - run: python scripts/doctor.py --workdir /tmp/ai-comic-drama-work
      - run: python scripts/check_compliance.py examples/episode.json
      - run: python scripts/previz.py examples/episode.json --out /tmp/previz.html
      - run: python scripts/estimate_cost.py examples/episode.json --rate 0.35 --pass-rate 0.65 --versions 3
      - run: python scripts/qa_report.py --manifest examples/episode.json --out /tmp/qa.json
      - run: python scripts/quickstart.py examples/episode.json --out /tmp/quickstart
      - run: python -m unittest discover -s tests -p 'test_*.py'
